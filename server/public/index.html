
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TM SAT Admin</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #fff;
      background:
        linear-gradient(rgba(4, 15, 35, 0.88), rgba(4, 15, 35, 0.95)),
        radial-gradient(circle at top right, #0d3a67 0%, #061427 45%, #020914 100%);
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      color: #ffd21f;
      text-align: center;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(8, 30, 56, 0.88);
      border: 1px solid #1f88ca;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
    }

    .card h2 {
      margin-top: 0;
      color: #fff;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #2d83b9;
      background: #0c3659;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input::placeholder {
      color: #d5e8f5;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .gold {
      background: #ffd21f;
      color: #111;
    }

    .blue {
      background: #1785c7;
      color: #fff;
    }

    .red {
      background: #cc3a3a;
      color: white;
    }

    .green {
      background: #238a4b;
      color: white;
    }

    .small {
      padding: 8px 12px;
      margin: 3px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .subscription {
      background: #0a2947;
      border: 1px solid #236c9c;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
    }

    .code {
      color: #ffd21f;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      direction: ltr;
      text-align: left;
    }

    .muted {
      color: #b8d3e6;
      font-size: 14px;
    }

    .status {
      margin-top: 10px;
      font-weight: bold;
    }

    .ok {
      color: #53dd8e;
    }

    .bad {
      color: #ff7373;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      body {
        padding: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>TM SAT — لوحة الاشتراكات</h1>

    <div class="card">
      <h2>دخول الإدارة</h2>

      <input
        id="adminPassword"
        type="password"
        placeholder="كلمة مرور المسؤول"
      />

      <button class="gold" onclick="login()">دخول</button>

      <div id="loginStatus" class="status"></div>
    </div>

    <div class="card">
      <h2>إنشاء اشتراك</h2>

      <div class="grid">
        <input
          id="label"
          type="text"
          placeholder="اسم الزبون - اختياري"
        />

        <input
          id="expiresAt"
          type="date"
        />
      </div>

      <button class="gold" onclick="createSubscription()">
        إنشاء كود
      </button>

      <div id="createStatus" class="status"></div>
    </div>

    <div class="card">
      <h2>الاشتراكات</h2>

      <button class="blue" onclick="loadSubscriptions()">
        تحديث القائمة
      </button>

      <div id="subscriptions"></div>
    </div>
  </div>

  <script>
    let adminToken = "";

    function authHeaders() {
      return {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + adminToken
      };
    }

    async function login() {
      const password = document.getElementById("adminPassword").value.trim();
      const status = document.getElementById("loginStatus");

      status.textContent = "جاري تسجيل الدخول...";
      status.className = "status";

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ password })
        });

        if (!response.ok) {
          throw new Error("كلمة المرور غير صحيحة");
        }

        adminToken = password;

        status.textContent = "تم تسجيل الدخول بنجاح";
        status.className = "status ok";

        loadSubscriptions();
      } catch (error) {
        status.textContent = error.message;
        status.className = "status bad";
      }
    }

    async function createSubscription() {
      const label = document.getElementById("label").value.trim();
      const expiresAt = document.getElementById("expiresAt").value;
      const status = document.getElementById("createStatus");

      if (!adminToken) {
        status.textContent = "سجّل دخول الإدارة أولاً";
        status.className = "status bad";
        return;
      }

      if (!expiresAt) {
        status.textContent = "اختر تاريخ انتهاء الاشتراك";
        status.className = "status bad";
        return;
      }

      status.textContent = "جاري إنشاء الكود...";
      status.className = "status";

      try {
        const response = await fetch("/api/admin/subscriptions", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({
            label,
            expiresAt
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "فشل إنشاء الكود");
        }

        status.innerHTML =
          'تم إنشاء الكود: <span class="code">' +
          data.subscription.code +
          "</span>";

        status.className = "status ok";

        document.getElementById("label").value = "";
        loadSubscriptions();
      } catch (error) {
        status.textContent = error.message;
        status.className = "status bad";
      }
    }

    async function loadSubscriptions() {
      if (!adminToken) {
        return;
      }

      const container = document.getElementById("subscriptions");

      container.innerHTML = "<p>جاري التحميل...</p>";

      try {
        const response = await fetch("/api/admin/subscriptions", {
          headers: {
            "Authorization": "Bearer " + adminToken
          }
        });

        const items = await response.json();

        if (!response.ok) {
          throw new Error("تعذر تحميل الاشتراكات");
        }

        if (!items.length) {
          container.innerHTML = "<p class='muted'>لا يوجد اشتراكات بعد.</p>";
          return;
        }

        container.innerHTML = items
          .map(item => {
            const device =
              item.boundDevice
                ? item.boundDevice
                : "غير مربوط بجهاز";

            const statusText =
              item.enabled
                ? "فعال"
                : "موقوف";

            const statusClass =
              item.enabled
                ? "ok"
                : "bad";

            return `
              <div class="subscription">
                <div class="code">${item.code}</div>

                <p>
                  <strong>الزبون:</strong>
                  ${item.label || "بدون اسم"}
                </p>

                <p>
                  <strong>الانتهاء:</strong>
                  ${item.expiresAt}
                </p>

                <p>
                  <strong>الجهاز:</strong>
                  ${device}
                </p>

                <p class="${statusClass}">
                  <strong>الحالة:</strong>
                  ${statusText}
                </p>

                <button
                  class="${item.enabled ? "red" : "green"} small"
                  onclick="toggleSubscription('${item.id}', ${!item.enabled})"
                >
                  ${item.enabled ? "إيقاف" : "تشغيل"}
                </button>

                <button
                  class="blue small"
                  onclick="unbind('${item.id}')"
                >
                  فك ربط الجهاز
                </button>

                <button
                  class="red small"
                  onclick="deleteSubscription('${item.id}')"
                >
                  حذف
                </button>
              </div>
            `;
          })
          .join("");

      } catch (error) {
        container.innerHTML =
          "<p class='bad'>" +
          error.message +
          "</p>";
      }
    }

    async function toggleSubscription(id, enabled) {
      try {
        await fetch("/api/admin/subscriptions/" + id, {
          method: "PATCH",
          headers: authHeaders(),
          body: JSON.stringify({ enabled })
        });

        loadSubscriptions();
      } catch (error) {
        alert("حدث خطأ");
      }
    }

    async function unbind(id) {
      try {
        await fetch(
          "/api/admin/subscriptions/" + id + "/unbind",
          {
            method: "POST",
            headers: authHeaders()
          }
        );

        loadSubscriptions();
      } catch (error) {
        alert("حدث خطأ");
      }
    }

    async function deleteSubscription(id) {
      if (!confirm("هل تريد حذف هذا الاشتراك؟")) {
        return;
      }

      try {
        await fetch("/api/admin/subscriptions/" + id, {
          method: "DELETE",
          headers: authHeaders()
        });

        loadSubscriptions();
      } catch (error) {
        alert("حدث خطأ");
      }
    }
  </script>
</body>
</html>

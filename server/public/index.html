<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TM SAT Admin</title>
<style>body{font-family:Arial;background:#001626;color:#fff;margin:0}.wrap{max-width:1100px;margin:30px auto;padding:20px}.card{background:#031f34;border:1px solid #1b4966;border-radius:16px;padding:18px;margin-bottom:18px}h1{color:#ffc238}input,button{padding:12px;border-radius:9px;border:1px solid #3d5f75;background:#082d47;color:white;margin:6px}input{min-width:210px}button{background:#ffc238;color:#111;font-weight:bold;cursor:pointer}.danger{background:#d9534f;color:#fff}.row{display:flex;flex-wrap:wrap;gap:6px}.sub{border-top:1px solid #31536b;padding:12px 0}.muted{color:#aebcc8;font-size:13px}.code{font-size:20px;color:#ffc238;font-weight:bold}</style></head><body><div class="wrap">
<h1>TM SAT — لوحة الاشتراكات</h1>
<div class="card"><h3>دخول الإدارة</h3><input id="pass" type="password" placeholder="ADMIN_PASSWORD"><button onclick="login()">دخول</button><span id="status"></span></div>
<div class="card"><h3>إنشاء اشتراك</h3><div class="row"><input id="label" placeholder="اسم الزبون"><input id="exp" type="date"><input id="server" placeholder="Xtream Server URL"><input id="user" placeholder="Username"><input id="pwd" placeholder="Password"><button onclick="createSub()">إنشاء كود</button></div><div class="muted">أضف فقط مصادر محتوى تملكها أو لديك ترخيص باستخدامها/إعادة توزيعها.</div></div>
<div class="card"><h3>الاشتراكات</h3><div id="list">سجّل الدخول أولاً.</div></div>
<script>
let token=''; const $=id=>document.getElementById(id);
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json','Authorization':'Bearer '+token}; const r=await fetch(url,opt); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j}
function login(){token=$('pass').value; load().catch(e=>$('status').textContent=' ❌ '+e.message)}
async function createSub(){const body={label:$('label').value,expiresAt:$('exp').value?new Date($('exp').value+'T23:59:59Z').toISOString():null,allPackages:true,xtream:{server:$('server').value,username:$('user').value,password:$('pwd').value}}; const s=await api('/api/v1/admin/subscriptions',{method:'POST',body:JSON.stringify(body)}); alert('الكود: '+s.code); await load()}
async function patch(id,body){await api('/api/v1/admin/subscriptions/'+id,{method:'PATCH',body:JSON.stringify(body)}); await load()}
async function del(id){if(confirm('حذف الاشتراك؟')){await api('/api/v1/admin/subscriptions/'+id,{method:'DELETE'});await load()}}
async function load(){const a=await api('/api/v1/admin/subscriptions'); $('status').textContent=' ✅'; $('list').innerHTML=a.map(s=>`<div class="sub"><div class="code">${s.code}</div><b>${s.label||'بدون اسم'}</b> — ${s.enabled?'فعال':'موقوف'}<div class="muted">الانتهاء: ${s.expiresAt||'بدون تاريخ'} | الجهاز: ${s.boundDevice||'غير مربوط'} | كل الباقات: ${s.allPackages?'نعم':'لا'}</div><button onclick="patch('${s.id}',{enabled:${!s.enabled}})">${s.enabled?'إيقاف':'تفعيل'}</button><button onclick="patch('${s.id}',{resetDevice:true})">فك ربط الجهاز</button><button class="danger" onclick="del('${s.id}')">حذف</button></div>`).join('')||'لا يوجد اشتراكات';}
</script></div></body></html>
